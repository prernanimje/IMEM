<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>Indian Market Events & Promotion | Turning Ideas into Impact</title>
    <meta name="description" content="Indian Market Events & Promotion (Est. 2018) delivers event management, brand activation, promotion, event production and manpower solutions across India." />
    <link rel="canonical" href="https://indianmarketevents.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://indianmarketevents.com/" />
    <meta property="og:title" content="Indian Market Events & Promotion | Turning Ideas into Impact" />
    <meta property="og:description" content="Indian Market Events & Promotion (Est. 2018) delivers event management, brand activation, promotion, event production and manpower solutions across India." />
    <meta property="og:site_name" content="Indian Market Events & Promotion" />
    <meta property="og:image" content="https://indianmarketevents.com/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="indianmarketevents.com" />
    <meta name="twitter:url" content="https://indianmarketevents.com/" />
    <meta name="twitter:title" content="Indian Market Events & Promotion | Turning Ideas into Impact" />
    <meta name="twitter:description" content="Pan-India Brand Activation, Corporate Events, CSR Initiatives & Event Production." />
    <meta name="twitter:image" content="https://indianmarketevents.com/logo.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Indian Market Events & Promotion",
      "alternateName": "Indian Market",
      "url": "https://indianmarketevents.com",
      "logo": "https://indianmarketevents.com/logo.png",
      "description": "Pan-India brand activation, corporate event management, and turnkey production agency.",
      "foundingDate": "2018",
      "founder": {
        "@type": "Person",
        "name": "Pratik Medhane",
        "jobTitle": "Founder & Event Director"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot No. 26, Shahu Nagar, Near ITI Bridge",
        "addressLocality": "Nashik",
        "addressRegion": "Maharashtra",
        "postalCode": "422008",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-8788972147",
        "contactType": "customer service",
        "email": "indianmarket.pratik@gmail.com"
      }
    }
    </script>
    
    <!-- Performance: Resource Hints & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Non-render-blocking Google Fonts with swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap">
    </noscript>

    <!-- Preload Primary Brand Logo for Fast LCP -->
    <link rel="preload" as="image" href="/logo-dark.png" type="image/png" fetchpriority="high">
    <meta name="theme-color" content="#08090d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
